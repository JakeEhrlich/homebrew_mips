<title>Crag Chip Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #F1F3F5; --ink: #1C2530; --ink-2: #5B6B7A; --chip: #FFFFFF; --reg: #E3E8ED; --rule: #C9D1D9; --corridor: #E8ECF0;
  --copper: #C46A22; --slate: #7A8794; --back: #1F6FB5; --hi: #0B8F6A; --hi-bg: #D6F0E6; --stim: #9A7A2F; --panel: #FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151A20; --ink: #E4E9EE; --ink-2: #9AA8B5; --chip: #202832; --reg: #2A3440; --rule: #3A4652; --corridor: #1B2129;
    --copper: #E8964F; --slate: #8E9CAA; --back: #62AEEE; --hi: #3FD39E; --hi-bg: #173A2E; --stim: #C9A86A; --panel: #1B2129;
  }
}
:root[data-theme="dark"] {
  --bg: #151A20; --ink: #E4E9EE; --ink-2: #9AA8B5; --chip: #202832; --reg: #2A3440; --rule: #3A4652; --corridor: #1B2129;
  --copper: #E8964F; --slate: #8E9CAA; --back: #62AEEE; --hi: #3FD39E; --hi-bg: #173A2E; --stim: #C9A86A; --panel: #1B2129;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 14px; height: 100vh; display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
header { display: flex; align-items: baseline; gap: 18px; padding: 10px 16px; border-bottom: 1px solid var(--rule); background: var(--bg); }
header h1 { font-size: 16px; font-weight: 600; margin: 0; }
header .meta { color: var(--ink-2); font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; }
header .spacer { flex: 1; }
header button { font: inherit; font-size: 12px; padding: 4px 10px; border: 1px solid var(--rule); background: var(--chip); color: var(--ink); border-radius: 3px; cursor: pointer; }
header button:focus-visible { outline: 2px solid var(--hi); outline-offset: 1px; }
main { display: grid; grid-template-columns: 1fr 320px; min-height: 0; }
#view { position: relative; overflow: hidden; cursor: grab; }
#view.dragging { cursor: grabbing; }
svg { display: block; width: 100%; height: 100%; }
aside { border-left: 1px solid var(--rule); background: var(--panel); padding: 14px 16px; overflow: auto; font-size: 13px; }
aside h2 { font-size: 12px; font-weight: 600; margin: 0 0 4px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); }
aside h3 { font-size: 15px; margin: 0 0 10px; font-weight: 600; }
aside .mono, aside table { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; }
aside table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
aside td, aside th { text-align: left; padding: 3px 6px 3px 0; line-height: 1.35; border-bottom: 1px solid var(--rule); vertical-align: top; }
aside th { color: var(--ink-2); font-weight: 500; }
aside p { margin: 6px 0; line-height: 1.45; }
aside .out { color: var(--copper); }
aside .legend { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--rule); color: var(--ink-2); font-size: 12px; }
aside .legend div { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
aside .legend svg { width: 42px; height: 12px; flex: none; }
.stage-title { font: 500 12px "IBM Plex Sans", sans-serif; letter-spacing: 0.12em; text-transform: uppercase; fill: var(--ink-2); }
.divider { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 3 5; }
.corridor { fill: var(--corridor); }
.corridor-label { font: 500 10px "IBM Plex Sans", sans-serif; letter-spacing: 0.1em; text-transform: uppercase; fill: var(--ink-2); }
.block > rect.body { fill: var(--bg); stroke: var(--ink); stroke-width: 1; }
.block.register > rect.body { fill: var(--reg); }
.block > text.title { font: 600 12px "IBM Plex Sans", sans-serif; fill: var(--ink); }
.block > text.count { font: 400 11px "IBM Plex Mono", monospace; fill: var(--ink-2); }
.chip rect { fill: var(--chip); stroke: var(--ink); stroke-width: 1.2; }
.chip text { font: 500 10.5px "IBM Plex Mono", monospace; fill: var(--ink); pointer-events: none; }
.chip.sram rect { stroke-width: 2; }
.chip:hover rect, .chip.sel rect { stroke: var(--hi); stroke-width: 2.2; fill: var(--hi-bg); }
.rail text { font: 400 10px "IBM Plex Mono", monospace; fill: var(--ink); }
.rail text.w { fill: var(--ink-2); }
.rail rect.hit { fill: transparent; }
.rail .port { fill: var(--ink); }
.rail.hi text { fill: var(--hi); font-weight: 500; }
.pinline { stroke: var(--copper); stroke-width: 0.6; opacity: 0.3; fill: none; }
.pinline.ctl { stroke: var(--slate); }
.pinline.hi { opacity: 1; stroke: var(--hi); stroke-width: 1.4; }
.bus { fill: none; stroke: var(--copper); stroke-linejoin: round; opacity: 0.8; }
.bus.ctl { stroke: var(--slate); opacity: 0.75; }
.bus.back { stroke: var(--back); }
.bus.stim { stroke: var(--stim); stroke-dasharray: 6 4; }
.bus.hi { stroke: var(--hi); opacity: 1; }
.bus.dim { opacity: 0.1; }
.bus-hit { fill: none; stroke: transparent; stroke-width: 10; cursor: pointer; }
.arrow { fill: var(--copper); }
.arrow.ctl { fill: var(--slate); }
.arrow.back { fill: var(--back); }
.arrow.stim { fill: var(--stim); }
.arrow.hi { fill: var(--hi); }
.src { fill: var(--copper); }
.src.ctl { fill: var(--slate); } .src.back { fill: var(--back); } .src.stim { fill: var(--stim); }
.note { font: 400 11px "IBM Plex Sans", sans-serif; fill: var(--ink-2); }
@media (prefers-reduced-motion: no-preference) { .bus, .pinline, .chip rect { transition: opacity .12s, stroke .12s; } }
</style>
<header>
  <h1>MIPS-I Chip Map</h1>
  <span class="meta" id="meta"></span>
  <span class="spacer"></span>
  <button id="fit" type="button">Fit</button>
  <button id="clear" type="button">Clear selection</button>
</header>
<main>
  <div id="view"><svg id="svg" role="img" aria-label="Every chip of the phase-1 CPU netlist grouped into named blocks inside the five pipeline stages; forward buses run in the channels between columns, backward and same-stage edges loop over the top corridor in blue, control signals run along the bottom"></svg></div>
  <aside id="panel"></aside>
</main>

const view = document.getElementById('view');
let vb = {x:0, y:0, w:totalW, h:totalH};
function fit() { const r = view.getBoundingClientRect(); const s = Math.max(totalW / r.width, totalH / r.height); vb = {x:0, y:0, w: r.width*s, h: r.height*s}; apply(); }
function apply() { svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
document.getElementById('fit').addEventListener('click', fit);
view.addEventListener('wheel', ev => { ev.preventDefault(); const r = view.getBoundingClientRect(); const mx = vb.x + (ev.clientX - r.left) / r.width * vb.w, my = vb.y + (ev.clientY - r.top) / r.height * vb.h; const k = Math.exp(ev.deltaY * 0.0015); vb = {x: mx - (mx - vb.x)*k, y: my - (my - vb.y)*k, w: vb.w*k, h: vb.h*k}; apply(); }, {passive:false});
// Pan only once the pointer has moved; a plain click reaches the wire or
// chip under it (pointer capture would steal the click).
let drag = null, moved = false;
view.addEventListener('pointerdown', ev => { if (ev.button !== 0) return; drag = {x:ev.clientX, y:ev.clientY, vx:vb.x, vy:vb.y}; moved = false; });
window.addEventListener('pointermove', ev => { if (!drag) return; const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y; if (!moved && Math.hypot(dx, dy) < 4) return; moved = true; view.classList.add('dragging'); const r = view.getBoundingClientRect(); vb.x = drag.vx - dx / r.width * vb.w; vb.y = drag.vy - dy / r.height * vb.h; apply(); });
window.addEventListener('pointerup', () => { drag = null; view.classList.remove('dragging'); });
svg.addEventListener('click', ev => { if (moved) { moved = false; ev.stopPropagation(); } }, true);
window.addEventListener('resize', fit);
fit();
</script>
